<!doctype html>
<html lang="ro" class="dark" style="background: #041329">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TDV Auto Expert</title>
    <meta
      name="description"
      content="Lecții de conducere profesioniste, axate pe precizie, siguranță și promovarea examenului auto."
    />
    <meta name="theme-color" content="#041329" />
    <meta property="og:locale" content="ro_RO" />
    <meta property="og:site_name" content="TDV Auto Expert" />
    <meta property="og:type" content="website" />
    <link rel="icon" type="image/jpeg" href="/images/tdv-logo.jpg" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- css2 API serves the latin-ext face (ă â î ș ț) automatically via unicode-range; subset kept as documentation -->
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Montserrat:wght@600;700&subset=latin,latin-ext&display=swap"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=block"
    />
    <!-- Boot loader (ticket 07): plain CSS, Tailwind isn't loaded yet. Invisible for the first 200ms. -->
    <style>
      #boot-loader {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 24px;
        background: radial-gradient(circle at 50% 50%, rgba(28, 42, 65, 0.8) 0%, #041329 70%);
        color: #fff6df;
        font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
        opacity: 0;
        animation: boot-fade-in 150ms ease-out 200ms forwards;
      }
      #boot-loader .ring { animation: boot-spin 3s linear infinite; transform-origin: 50% 50%; }
      #boot-loader .arc { animation: boot-spin 2s linear infinite; transform-origin: 50% 50%; }
      #boot-loader .brand { font-size: 24px; line-height: 32px; font-weight: 700; letter-spacing: 0.025em; opacity: 0.8; }
      #boot-loader .sr-only {
        position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0, 0, 0, 0); border: 0;
      }
      @keyframes boot-spin { to { transform: rotate(360deg); } }
      @keyframes boot-fade-in { to { opacity: 1; } }
      @media (prefers-reduced-motion: reduce) {
        #boot-loader, #boot-loader .ring, #boot-loader .arc { animation: none; opacity: 1; }
      }
      noscript p { color: #d0c6ab; font-family: system-ui, sans-serif; text-align: center; padding: 48px 16px; }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="boot-loader" role="status" aria-live="polite">
        <svg width="160" height="160" viewBox="0 0 100 100" aria-hidden="true">
          <g class="ring"><circle cx="50" cy="50" r="45" fill="none" stroke="#27354c" stroke-width="2" stroke-dasharray="10 5" /></g>
          <g class="arc"><circle cx="50" cy="50" r="36" fill="none" stroke="#ffd700" stroke-opacity="0.8" stroke-width="4" stroke-linecap="round" stroke-dasharray="160" stroke-dashoffset="40" /></g>
          <!-- speedometer glyph drawn inline: the icon font isn't loaded yet -->
          <path d="M34 58a16 16 0 1 1 32 0" fill="none" stroke="#ffd700" stroke-width="4" stroke-linecap="round" />
          <path d="M50 58l8-10" stroke="#ffd700" stroke-width="4" stroke-linecap="round" />
          <circle cx="50" cy="58" r="3" fill="#ffd700" />
        </svg>
        <p class="brand">TDV Auto Expert</p>
        <span class="sr-only">Se încarcă pagina, te rugăm să aștepți</span>
      </div>
    </div>
    <noscript><p>Activează JavaScript pentru a vedea site-ul TDV Auto Expert.</p></noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
